plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}"
    version = "${minecraft_version}-${version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)

    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared Maven (JEI / CraftTweaker / Bookshelf)'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = "MrCrayfish (GitHub)"
        url = "https://maven.pkg.github.com/MrCrayfish/Maven"
        credentials {
            username = "CodinGlitch"
            password = project.property("github_token")
        }
    }

    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    maven { url 'https://maven.maxhenkel.de/repository/public' }
    maven { url 'https://maven.nucleoid.xyz' }
    maven { url 'https://maven.codinglitch.com/repository/releases' }

    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    maven {
        name = "Valkyrien Skies Internal"
        url = 'https://maven.valkyrienskies.org'
    }

    maven { url = "https://mvn.devos.one/releases" }
    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.tterrag.com" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id-${project.name}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

configurations {
    apiJava {
        canBeResolved = true
    }
}

dependencies {
    // --- Common --- \\

    implementation(project(':api'))
    apiJava project(path: ':api', configuration: 'apiJava')
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            "version"                       : version,
            "group"                         : project.group, //Else we target the task's group.
            "minecraft_version"             : minecraft_version,
            "forge_version"                 : forge_version,
            "forge_version_range"           : forge_version_range,
            "minecraft_version_range"       : minecraft_version_range,
            "fabric_version"                : fabric_version,
            "fabric_loader_version"         : fabric_loader_version,
            "fabric_minecraft_version_range": fabric_minecraft_version_range,
            "mod_name"                      : mod_name,
            "mod_author"                    : mod_author,
            "mod_id"                        : mod_id,
            "license"                       : license,
            "description"                   : project.description,
            "neoforge_version"              : neoforge_version,
            "neoforge_version_range"        : neoforge_version_range,
            "voicechat_api_version"         : voicechat_api_version,
            "voicechat_version"             : voicechat_version,
            "voicechat_interaction_version" : voicechat_interaction_version,
            "polymer_version"               : polymer_version,
            "night_config_version"          : night_config_version,
            "lexiconfig_version"            : lexiconfig_version,
            "vibrative_voice_version"       : vibrative_voice_version,
            "create_version"                : create_version,
            "name_template"                 : name_template,
            "modrinth_id"                   : modrinth_id,
            "curseforge_id"                 : curseforge_id,
            "supported_versions"            : supported_versions,
            "requiredDependencies"          : requiredDependencies,
            "optionalDependencies"          : optionalDependencies,
            "parchment_minecraft"           : parchment_minecraft,
            "parchment_version"             : parchment_version,
            "release_type"                  : release_type,
            "credits"                       : credits
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
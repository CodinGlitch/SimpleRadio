plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

apply from: 'https://raw.githubusercontent.com/CodinGlitch/gradle-templates/main/repository-publishers/codinglitch.gradle'

neoForge {
    neoFormVersion = neo_form_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    //compileOnly project(":common")
}

configurations {
    apiJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    apiJava sourceSets.main.java.sourceDirectories.singleFile
}

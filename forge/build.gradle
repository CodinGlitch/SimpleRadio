plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.2,8.0)'
    id 'net.minecraftforge.jarjar' version '0.2.3'
    id "com.modrinth.minotaur" version "2.+"
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

/*mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}*/

jarJar.register()

minecraft {
    mappings channel: 'official', version: minecraft_version

    //copyIdeResources = true //Calls processResources when in dev

    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')

            args "--mixin.config=${mod_id}.mixins.json"
            args "--mixin.config=${mod_id}.forge.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    implementation "com.codinglitch.lexiconfig:lexiconfig-forge:${lexiconfig_version}"

    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    implementation "maven.modrinth:simple-voice-chat:forge-${minecraft_version}-${voicechat_version}"

    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}"))

    // -- Compatibilities -- \\

    // Vibrative Voice
    implementation "com.codinglitch.vibrativevoice:vibrativevoice-api:${vibrative_voice_version}"

    // Valkyrien Skies
    if (valkyrien_skies_env_versions.contains(minecraft_version)) {
        compileOnly "org.valkyrienskies:valkyrienskies-${minecraft_version.replace('.', '')}-forge:${valkyrien_skies_version}"
        runtimeOnly "org.valkyrienskies:valkyrienskies-${minecraft_version.replace('.', '')}-forge:${valkyrien_skies_version}"
        implementation("org.valkyrienskies.core:api:${valkyrien_skies_api_version}")
        // forge wont inherit the api from common for some reason
    }

    // Create
    if (create_env_versions.contains(minecraft_version)) {
        implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim")
        implementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
        compileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
        runtimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
        implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    }

    // JEI / REI
    if (recipe_viewer == "jei") {
        // compile against the JEI API but do not include it at runtime
        compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
        compileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
        // at runtime, use the full JEI jar for Forge
        runtimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    } else if (recipe_viewer == "rei") {
        // TODO: add rei to devenv
    }

    // Config mods
    if (config_mod == "configured") {
        runtimeOnly "com.mrcrayfish:configured-forge:${configured_version}"
    } else if (config_mod == "cloth_config") {

    } else if (config_mod == "owo") {

    } else if (config_mod == "config_screens") {

    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}
tasks.named('jarJar') {
    archiveClassifier = ''
}
tasks.('jar') {
    archiveClassifier = "slim"
    manifest {
        attributes 'ContainedDeps': "mixinextras-forge-${mixin_extras_version}.jar"
    }
}
jar.finalizedBy('reobfJar')

processResources {
    from project(":common").sourceSets.main.resources
    from project(":forge").sourceSets.main.resources
}


java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.jarJar
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

ponder              = "1.0.81"
flywheel            = "1.0.6"
registrate          = "MC1.21-1.3.0+67"

[libraries]
#---- Common ----#
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
mixinextras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixin_extras" }

voicechat_api = { group="de.maxhenkel.voicechat", name="voicechat-api", version.ref="voicechat_api" }
lexiconfig_api = { group="com.codinglitch.lexiconfig", name="lexiconfig-api", version.ref="lexiconfig" }

computercraft = { group="cc.tweaked", name="cc-tweaked-1.21.1-common-api", version.ref="computercraft" }
vibrativevoice_api = { group="com.codinglitch.vibrativevoice", name="vibrativevoice-api", version.ref="vibrative_voice" }
valkyrienskies = { group="org.valkyrienskies.core", name="api", version.ref="valkyrien_skies_api"}

jei = { group="mezz.jei", name="jei-1.21.1-common-api", version.ref="jei" }

#---- Fabric ----#
fabric = { group="net.fabricmc", name="fabric-loader", version.ref="fabric_loader" }
fabric_api = { group="net.fabricmc.fabric-api", name="fabric-api", version.ref="fabric_api" }

fabric_minecraft = { group="com.mojang", name="minecraft", version.ref="minecraft" }

fabric_lexiconfig = { group="com.codinglitch.lexiconfig", name="lexiconfig-fabric", version.ref="lexiconfig" }
fabric_voicechat = { group="maven.modrinth", name="simple-voice-chat", version.ref="fabric_voicechat" }

fabric_audioplayer = { group="maven.modrinth", name="audioplayer", version.ref="audioplayer" }
fabric_admiral = { group="maven.modrinth", name="admiral", version.ref="admiral" }

fabric_voicechatinteraction = { group="maven.modrinth", name="voice-chat-interaction", version.ref="vc_interaction" }
fabric_polymer = { group="eu.pb4", name="polymer-reg-sync-manipulator", version.ref="polymer" }

fabric_computercraft_api = { group="cc.tweaked", name="cc-tweaked-1.21.1-fabric-api", version.ref="computercraft" }
fabric_computercraft = { group="cc.tweaked", name="cc-tweaked-1.21.1-fabric", version.ref="computercraft" }

fabric_valkyrienskies = { group="org.valkyrienskies", name="valkyrienskies-1211-fabric", version.ref="valkyrien_skies" }

fabric_create = { group="com.simibubi.create", name="create-fabric", version.ref="create_fabric"}

fabric_jei = { group="mezz.jei", name="jei-1.21.1-fabric", version.ref="jei"}

fabric_configured = { group="com.mrcrayfish", name="configured-fabric", version.ref="configured"}

#---- NeoForge ----#
neoforge_lexiconfig = { group="com.codinglitch.lexiconfig", name="lexiconfig-neoforge", version.ref="lexiconfig" }
neoforge_voicechat = { group="maven.modrinth", name="simple-voice-chat", version.ref="neoforge_voicechat" }

neoforge_computercraft_api = { group="cc.tweaked", name="cc-tweaked-1.21.1-forge-api", version.ref="computercraft" }
neoforge_computercraft = { group="cc.tweaked", name="cc-tweaked-1.21.1-forge", version.ref="computercraft" }

neoforge_etched = { group="curse.maven", name="etched-491890", version.ref="etched" }

neoforge_valkyrienskies = { group="org.valkyrienskies", name="valkyrienskies-1211-neoforge", version.ref="valkyrien_skies" }

neoforge_create = { group="com.simibubi.create", name="create-neoforge", version.ref="create"}

neoforge_jei = { group="mezz.jei", name="jei-1.21.1-neoforge", version.ref="jei"}

neoforge_configured = { group="com.mrcrayfish", name="configured-neoforge", version.ref="configured"}

#---- NeoForge ----#


[plugins]
#---- Publishing ----#
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
cursegradle = { id = "net.darkhax.curseforgegradle", version.ref = "curse_gradle" }

#---- Loaders ----#
moddevgradle = { id = "net.neoforged.moddev", version.ref = "mod_dev_gradle" }
loom = { id = "fabric-loom", version.ref = "loom" }

[bundles]
#---- Fabric ----#
fabric_modImpl = [ "fabric", "fabric_api" ]

# All mods that should be enabled in the Fabric development environment.
fabric_environment = [
    "fabric_lexiconfig",
    "fabric_voicechat",
    "fabric_audioplayer",
    "fabric_admiral",
    "fabric_computercraft",
    "fabric_voicechatinteraction",
    "fabric_polymer",
#    "vibrativevoice",
#    "fabric_valkyrienskies",
#    "fabric_create",

    "fabric_jei",

    "fabric_configured"
]

#---- NeoForge ----#

# All mods that should be enabled in the NeoForge development environment.
neoforge_environment = [
    "neoforge_lexiconfig",
    "neoforge_voicechat",
    "neoforge_etched",
    "neoforge_computercraft",
    #    "vibrativevoice",
    #    "neoforge_valkyrienskies",
    #    "neoforge_create",

    "neoforge_jei",

    "neoforge_configured"
]